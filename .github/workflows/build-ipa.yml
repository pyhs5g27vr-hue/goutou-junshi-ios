name: build-ipa

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true

      - name: Select newest Xcode
        run: |
          set -e
          CHOSEN=""
          for c in /Applications/Xcode_27*.app /Applications/Xcode_26*.app \
                   /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$c" ]; then CHOSEN="$c"; break; fi
          done
          if [ -z "$CHOSEN" ]; then CHOSEN=$(ls -d /Applications/Xcode*.app | head -1); fi
          echo "Using $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Goutoujunshi.xcodeproj \
            -scheme Goutoujunshi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | tail -60

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          # 侧载工具（Sideloadly / AltStore）能直接吃未签名 IPA
          zip -qry Goutoujunshi-unsigned.ipa Payload
          ls -lh Goutoujunshi-unsigned.ipa
          unzip -l Goutoujunshi-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: Goutoujunshi-ipa
          path: Goutoujunshi-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
